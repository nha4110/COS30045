<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6.4 - TV Scatterplot Tooltips</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/visualisation.css">
</head>
<body>
    <main class="page-container">
        <h1>TV Energy Consumption by Star Rating</h1>
        <section class="filter-section" aria-label="Filter TVs by screen technology">
            <h2>Screen technology</h2>
            <div id="filters_screen" class="filter-controls"></div>
            <p id="filter-status" class="filter-status" aria-live="polite"></p>
        </section>
        <section class="chart-section" aria-label="TV energy consumption frequency histogram">
            <div
                id="histogram"
                class="visualisation-container"
                role="img"
                aria-label="Histogram showing the frequency of TV energy consumption in 200 kilowatt-hour bins">
            </div>
        </section>
        <section class="filter-section size-filter-section" aria-label="Filter TVs by screen size">
            <h2>Screen size</h2>
            <div id="filters_size" class="filter-controls"></div>
        </section>
        <section class="chart-section" aria-label="TV energy consumption by star rating">
            <h2>Energy consumption by star rating</h2>
            <div
                id="scatterplot"
                class="visualisation-container"
                role="img"
                aria-label="Scatterplot of TV energy consumption by star rating, colored by screen technology">
            </div>
        </section>
    </main>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/load-data.js"></script>
    <script src="js/shared-constants.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/scatterplot.js"></script>
</body>
</html>
